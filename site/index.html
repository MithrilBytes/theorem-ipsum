<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theorem Ipsum</title>
<meta name="description" content="A complete nonsense mathematics paper, generated in your browser. Same seed, same paper.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='14' y='14' width='72' height='72' rx='12' fill='%234a5899'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script type="module" src="main.js"></script>
</head>
<body>

<div class="layout">
  <aside class="side">
    <h1>Theorem Ipsum</h1>
    <p>
      This paper is complete nonsense, generated in your browser.
      The URL carries the seed: same seed, same paper, same theorems,
      none of them true.
    </p>
    <p>
      Successor to
      <a href="https://github.com/sylvanfranklin/nonsense">nonsense</a>
      and <a href="https://thatsmathematics.com/mathgen/">mathgen</a>.
    </p>
    <label class="seed-label" for="seed">seed</label>
    <input id="seed" type="text" spellcheck="false" autocomplete="off" aria-label="Seed">
    <button id="randomize">randomize</button>
    <button id="download" class="secondary">download .tex</button>
    <div class="dials">
      <div class="dial" title="Page length: note to treatise">
        <label for="length">length</label>
        <input id="length" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Page length">
        <span class="dial-value" data-value="length">0.50</span>
      </div>
      <div class="dial" title="Sentence length: terse to winding">
        <label for="sentence">sentence</label>
        <input id="sentence" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Sentence length">
        <span class="dial-value" data-value="sentence">0.50</span>
      </div>
      <div class="dial" title="Paragraph length: choppy to sprawling">
        <label for="paragraph">paragraph</label>
        <input id="paragraph" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Paragraph length">
        <span class="dial-value" data-value="paragraph">0.50</span>
      </div>
      <div class="dial" title="Gobbledygook: sober to unhinged">
        <label for="gobbledygook">gobbledygook</label>
        <input id="gobbledygook" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Gobbledygook">
        <span class="dial-value" data-value="gobbledygook">0.50</span>
      </div>
    </div>
    <p class="install">
      <a href="https://github.com/MithrilBytes/theorem-ipsum">github.com/MithrilBytes/theorem-ipsum</a>
    </p>
  </aside>

  <main class="sheet-wrap">
    <div id="paper" class="sheet"></div>
    <noscript><p class="noscript">Theorem Ipsum needs JavaScript; the paper is generated in your browser.</p></noscript>
  </main>
</div>

</body>
</html>
