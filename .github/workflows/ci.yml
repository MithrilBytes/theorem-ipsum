name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:site

  latex-compiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate papers
        run: |
          npx esbuild src/cli.ts --bundle --format=esm --platform=node --outfile=/tmp/cli.mjs
          for seed in 1 2 3 tame-quandle; do
            node /tmp/cli.mjs --seed "$seed" --format latex --out "/tmp/paper-$seed.tex"
          done
      - name: Compile with Tectonic
        uses: wtfjoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c # v4.0.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tectonic-version: "0.17.0"
      - name: Cache Tectonic packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}
      - run: |
          for f in /tmp/paper-*.tex; do
            echo "== $f"
            for i in 1 2 3; do
              tectonic "$f" --outdir /tmp && break
              echo "tectonic attempt $i failed; retrying in 30s"
              sleep 30
            done
            test -f "${f%.tex}.pdf" || { echo "missing PDF for $f"; exit 1; }
          done
