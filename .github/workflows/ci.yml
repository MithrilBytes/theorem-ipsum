name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:site

  latex-compiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate papers
        run: |
          npx esbuild src/cli.ts --bundle --format=esm --platform=node --outfile=/tmp/cli.mjs
          for seed in 1 2 3 tame-quandle; do
            node /tmp/cli.mjs --seed "$seed" --format latex --out "/tmp/paper-$seed.tex"
          done
      - name: Compile with Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Tectonic packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}
      - run: |
          for f in /tmp/paper-*.tex; do
            echo "== $f"
            for i in 1 2 3; do
              tectonic "$f" --outdir /tmp && break
              echo "tectonic attempt $i failed; retrying in 30s"
              sleep 30
            done
            test -f "${f%.tex}.pdf" || { echo "missing PDF for $f"; exit 1; }
          done
