name: Daily paper

on:
  schedule:
    # The 18:00 run backfills automatically if the noon run failed.
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-paper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate the paper of the day
        id: gen
        run: |
          seed=$(date -u +%F)
          npx esbuild src/cli.ts --bundle --format=esm --platform=node --outfile=/tmp/cli.mjs
          node /tmp/cli.mjs --seed "$seed" -f latex -o "theorem-ipsum-$seed.tex"
          title=$(grep -m1 '^\\title{' "theorem-ipsum-$seed.tex" | sed -e 's/^\\title{//' -e 's/}$//')
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Skip if already published today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ steps.gen.outputs.seed }}
        run: |
          seed="$SEED"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && gh release view "daily-$seed" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: wtfjoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c # v4.0.6
        if: steps.check.outputs.published == 'false'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tectonic-version: "0.17.0"
      - name: Cache Tectonic packages
        if: steps.check.outputs.published == 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}
      - name: Compile
        if: steps.check.outputs.published == 'false'
        env:
          SEED: ${{ steps.gen.outputs.seed }}
        run: |
          seed="$SEED"
          for i in 1 2 3; do
            tectonic "theorem-ipsum-$seed.tex" && break
            echo "tectonic attempt $i failed; retrying in 30s"
            sleep 30
          done
          test -f "theorem-ipsum-$seed.pdf"
      - name: Publish release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ steps.gen.outputs.seed }}
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          seed="$SEED"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release delete "daily-$seed" --yes --cleanup-tag 2>/dev/null || true
          fi
          for i in 1 2 3; do
            gh release create "daily-$seed" \
              --title "$TITLE" \
              --notes "Paper of the day, seed \`$seed\`. Reproduce it at https://mithrilbytes.github.io/theorem-ipsum/?seed=$seed" \
              "theorem-ipsum-$seed.tex" "theorem-ipsum-$seed.pdf" && break
            echo "release attempt $i failed; retrying in 20s"
            sleep 20
          done
          gh release view "daily-$seed" >/dev/null
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily paper workflow failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "See $url. The 18:00 UTC run retries automatically."
          fi
